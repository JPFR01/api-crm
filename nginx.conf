events { 
    worker_connections 1024; 
}

http {
  server_tokens off;

  # rate limit mais conservador
  limit_req_zone $binary_remote_addr zone=meta_limit:10m rate=10r/s;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log;

  upstream api_upstream { 
    server api:3000; 
  }

  server {
    listen 80;
    server_name localhost;

    client_max_body_size 10m;

    # Webhook público da Meta -> API
    location = /v1/webhook/whatsapp-meta {
      limit_req zone=meta_limit burst=20 nodelay;

      proxy_pass http://api_upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Repassa assinatura da Meta
      proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    }

    # Bloqueia o resto (não expõe n8n)
    location / {
      return 404;
    }
  }
}
